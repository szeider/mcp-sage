[project]
name = "mcp-sage"
version = "0.1.0"
description = "MCP server providing persistent SageMath sessions (Sage REPL over the Model Context Protocol)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Stefan Szeider" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2",
    "jupyter_client>=8.0.0",
    "ipykernel>=6.0.0",
]
keywords = ["mcp", "sagemath", "sage", "computer-algebra", "model-context-protocol", "agent"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
mcp-sage = "sage_repl_server:cli"

[project.urls]
Repository = "https://github.com/szeider/sage-mcp"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["sage_repl_server"]
